<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SH Works | Freelance Services Marketplace</title>
<meta name="description" content="Hire trusted Pakistani freelancers for web, design, video and writing. Escrow-protected payments.">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT:'#10B981', dark:'#059669', soft:'#ECFDF5' } } } } }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-40 bg-white border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-4">
    <a href="#/" class="font-extrabold text-lg">SH<span class="text-brand">Works</span></a>
    <nav class="ml-auto flex items-center gap-2 text-sm" id="nav"></nav>
  </div>
</header>

<main id="app" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8"></main>

<footer class="border-t border-slate-200 bg-white text-center text-xs text-slate-400 py-5">
  &copy; <span id="yr"></span> SH Works (sh.works). All rights reserved.
</footer>

<!-- Auth modal -->
<div id="authModal" class="hidden fixed inset-0 bg-slate-900/50 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md p-6 relative">
    <button id="authClose" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700" aria-label="Close">&times;</button>
    <div class="flex gap-2 mb-5 text-sm font-semibold">
      <button data-mode="signin" class="auth-tab flex-1 py-2 rounded-lg border">Sign in</button>
      <button data-mode="signup" class="auth-tab flex-1 py-2 rounded-lg border">Create account</button>
    </div>
    <form id="authForm" class="space-y-3">
      <div id="nameWrap" class="hidden space-y-3">
        <input name="name" placeholder="Full name" class="w-full border rounded-lg px-3 py-2 text-sm">
        <select name="role" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="client">I want to hire (client)</option>
          <option value="freelancer">I want to sell services (freelancer)</option>
        </select>
      </div>
      <input name="email" type="email" required placeholder="Email" class="w-full border rounded-lg px-3 py-2 text-sm">
      <input name="password" type="password" required minlength="6" placeholder="Password (min 6 characters)" class="w-full border rounded-lg px-3 py-2 text-sm">
      <p id="authErr" class="text-sm text-red-600 hidden"></p>
      <button id="authSubmit" class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-2.5 rounded-lg">Sign in</button>
    </form>
  </div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-5 py-2.5 rounded-full opacity-0 transition-opacity pointer-events-none z-[60]"></div>

<script src="app.js"></script>
</body>
</html>
